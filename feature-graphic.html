<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Baloo 2";src:url("fonts/baloo2-latin.woff2") format("woff2");font-weight:400 800;}
*{margin:0;padding:0;box-sizing:border-box}
.fg{width:1024px;height:500px;position:relative;overflow:hidden;
  background:radial-gradient(120% 130% at 85% 8%, #aee3ff 0%, #5cb6ff 38%, #3e8ef7 72%, #2f63e8 100%);
  font-family:"Baloo 2","Comic Sans MS",sans-serif}
.sun{position:absolute;top:-90px;right:-70px;width:320px;height:320px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,246,200,.95),rgba(255,240,170,0) 70%)}
.cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85}
.c1{width:170px;height:46px;top:60px;left:38%}
.c1::before{content:"";position:absolute;width:80px;height:80px;background:#fff;border-radius:50%;top:-34px;left:30px}
.c2{width:120px;height:34px;top:120px;left:64%;opacity:.6}
.c2::before{content:"";position:absolute;width:56px;height:56px;background:#fff;border-radius:50%;top:-24px;left:24px}
.hill{position:absolute;left:0;right:0;bottom:0;height:150px;background:linear-gradient(#5fce6b,#3fae4b);
  border-radius:50% 50% 0 0/80px 80px 0 0}
.charwrap{position:absolute;left:42px;top:88px;width:320px;height:320px}
.glow{position:absolute;inset:-10px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.65),rgba(255,255,255,0) 65%)}
.charwrap img{width:320px;height:320px;border-radius:64px;position:relative;
  box-shadow:0 18px 34px rgba(0,0,40,.28)}
.text{position:absolute;left:400px;top:96px;right:40px}
h1{font-size:104px;font-weight:800;line-height:.9;letter-spacing:1px;
  color:#ffce3a;-webkit-text-stroke:9px #8a3a00;paint-order:stroke fill;
  text-shadow:0 8px 0 rgba(122,52,0,.45)}
h1 .l2{display:block;font-size:90px;margin-top:6px}
.tag{margin-top:26px;font-size:33px;font-weight:700;color:#fff;
  -webkit-text-stroke:5px #2148a8;paint-order:stroke fill}
.coins{margin-top:22px}
.coin{display:inline-block;width:46px;height:46px;border-radius:50%;margin-right:12px;
  background:radial-gradient(circle at 38% 32%,#ffe14d,#f0a800);border:4px solid #c8860a;
  box-shadow:0 4px 0 rgba(0,0,0,.18)}
</style></head><body>
<div class="fg">
  <div class="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div>
  <div class="hill"></div>
  <div class="charwrap"><div class="glow"></div><img src="icon-512.png"></div>
  <div class="text">
    <h1>RAIL<span class="l2">RASCALS!</span></h1>
    <div class="tag">Dash &amp; dodge through 7 wild worlds!</div>
    <div class="coins"><span class="coin"></span><span class="coin"></span><span class="coin"></span><span class="coin"></span></div>
  </div>
</div>
</body></html>
